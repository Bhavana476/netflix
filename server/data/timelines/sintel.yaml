    - { id: sub_sin_01, start: 180, end: 183, text: "You're lucky to be alive.", alternates: { es: "Tienes suerte de estar viva.", fr: "Tu as de la chance d'être en vie." } }
    - { id: sub_sin_02, start: 184, end: 188, text: "What brings you to the land of the gatekeepers?", alternates: { es: "¿Qué te trae a la tierra de los guardianes?", fr: "Qu'est-ce qui t'amène au pays des gardiens ?" } }
    - { id: sub_sin_03, start: 189, end: 191, text: "I'm searching for someone.", alternates: { es: "Estoy buscando a alguien.", fr: "Je cherche quelqu'un." } }
    - { id: sub_sin_04, start: 192, end: 195, text: "Someone very dear? A kindred spirit?", alternates: { es: "¿Alguien muy querido? ¿Un alma gemela?", fr: "Quelqu'un de très cher ? Une âme sœur ?" } }
    - { id: sub_sin_05, start: 196, end: 199, text: "A dragon.", alternates: { es: "Un dragón.", fr: "Un dragon." } }
    - { id: sub_sin_06, start: 335, end: 339, text: "[Scales squeaks happily]", alternates: { es: "[Scales chilla feliz]", fr: "[Scales couine de joie]" } }
    - { id: sub_sin_07, start: 392, end: 396, text: "Scales! No!", alternates: { es: "¡Scales! ¡No!", fr: "Scales ! Non !" } }

