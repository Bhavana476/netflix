characters:
  - id: c_thom
    name: Thom
    description: Celia's former boyfriend, who left her to chase his dream of going to space
  - id: c_celia
    name: Celia
    description: a scientist working on robotics who was hurt when Thom left her
  - id: c_team
    name: The Team
    description: a group of warriors and scientists trying to rescue the world from destructive robots

subtitles:
  version: 1
  defaultLocale: en
  lines:
    - { id: sub_tos_01, start: 5, end: 8, text: "You're a jerk, Thom.", alternates: { es: "Eres un imbécil, Thom.", fr: "T'es qu'un crétin, Thom." } }
    - { id: sub_tos_02, start: 9, end: 12, text: "Look, Celia, we have to follow our passions.", alternates: { es: "Mira, Celia, tenemos que seguir nuestras pasiones.", fr: "Écoute, Celia, on doit suivre nos passions." } }
    - { id: sub_tos_03, start: 12, end: 16, text: "You have your robotics, and I just want to be awesome in space.", alternates: { es: "Tú tienes tu robótica y yo solo quiero ser genial en el espacio.", fr: "Toi tu as ta robotique, et moi je veux juste être génial dans l'espace." } }
    - { id: sub_tos_04, start: 17, end: 20, text: "Why don't you just admit that you're freaked out by my robot hand?", alternates: { es: "¿Por qué no admites que te asusta mi mano robótica?", fr: "Avoue que ma main robotique te fait flipper." } }
    - { id: sub_tos_05, start: 470, end: 475, text: "I'm sorry, Celia. I'm sorry for everything.", alternates: { es: "Lo siento, Celia. Lo siento por todo.", fr: "Je suis désolé, Celia. Désolé pour tout." } }

events:
  - { id: evt_tos_001, ts: 0, type: scene, title: "The breakup", text: "On a bridge in Amsterdam, Celia breaks up with Thom, who wants to go to space." }
  - { id: evt_tos_002, ts: 0, endTs: 120, type: character, characterId: c_thom, text: "Thom argues with Celia on the bridge." }
  - { id: evt_tos_003, ts: 2, endTs: 120, type: character, characterId: c_celia, text: "Celia confronts Thom on the bridge." }
  - { id: evt_tos_004, ts: 20, type: trivia, importance: high, text: "Tears of Steel (project 'Mango', 2012) was the Blender Foundation's first live-action open movie, mixing real footage with CG." }
  - { id: evt_tos_005, ts: 25, type: glossary, term: Robot hand, definition: "Celia's prosthetic robotic hand - a hint at the robotics work that shapes the future." }
  - { id: evt_tos_006, ts: 60, type: trivia, text: "The Mango project set out to improve Blender's visual-effects tools, especially camera/motion tracking and compositing." }
  - { id: evt_tos_007, ts: 120, type: scene, title: "Years later", text: "In a ruined, robot-occupied Amsterdam, a team prepares to restage a moment from the past." }
  - { id: evt_tos_008, ts: 125, endTs: 700, type: character, characterId: c_team, text: "The team of warriors and scientists prepares for the operation." }
  - { id: evt_tos_009, ts: 150, type: glossary, term: Motion tracking, definition: "A VFX technique that follows points in real footage so CG elements can be locked to the camera's movement." }
  - { id: evt_tos_010, ts: 200, endTs: 700, type: character, characterId: c_thom, text: "An older Thom works with the team." }
  - { id: evt_tos_011, ts: 240, type: scene, title: "The Oude Kerk", text: "The team gathers at Amsterdam's old church to stage the crucial breakup from the past." }
  - { id: evt_tos_012, ts: 260, type: glossary, term: Oude Kerk, definition: "Amsterdam's 'Old Church', a medieval church in the city's old centre." }
  - { id: evt_tos_013, ts: 300, type: trivia, importance: high, text: "Tears of Steel was written and directed by Ian Hubert and shot in Amsterdam." }
  - { id: evt_tos_014, ts: 360, type: scene, title: "Robots attack", text: "Giant robots assault the team's position while they fight to buy time." }
  - { id: evt_tos_015, ts: 420, type: glossary, term: Green screen, definition: "A solid-coloured backdrop that is replaced with digital imagery in post-production." }
  - id: evt_tos_016
    ts: 466
