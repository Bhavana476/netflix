    name: Rinky
    description: a red squirrel and one of the three bullies tormenting Bunny
  - id: c_gimera
    name: Gimera
    description: a chinchilla, the smallest of the three bullies
  - id: c_butterfly
    name: The Butterflies
    description: the delicate meadow butterflies that Bunny adores

