events:
  - { id: evt_bbb_001, ts: 0, type: scene, title: "Morning in the meadow", text: "Birds stir in the trees as morning comes to a sunlit forest meadow." }
  - { id: evt_bbb_002, ts: 5, type: trivia, importance: high, text: "Big Buck Bunny was produced by the Blender Institute as open movie project 'Peach' and released in 2008." }
  - { id: evt_bbb_003, ts: 20, type: trivia, text: "The film was made with free and open-source software, with Blender as the main 3D tool." }
  - { id: evt_bbb_004, ts: 40, endTs: 560, type: character, characterId: c_bunny, text: "Bunny wakes up and squeezes out of his burrow beneath a tree." }
  - { id: evt_bbb_005, ts: 70, type: glossary, term: Burrow, definition: "A hole or tunnel dug by a small animal, such as a rabbit, to live in." }
  - { id: evt_bbb_006, ts: 90, type: scene, title: "Bunny greets the morning", text: "Bunny stretches, sniffs a flower and is delighted by a butterfly." }
  - { id: evt_bbb_007, ts: 110, endTs: 260, type: character, characterId: c_butterfly, text: "A butterfly flutters around Bunny." }
  - { id: evt_bbb_008, ts: 130, type: trivia, text: "Big Buck Bunny is released under a Creative Commons Attribution license, so anyone may reuse or remix it with credit." }
  - { id: evt_bbb_009, ts: 150, endTs: 560, type: character, characterId: c_frank, text: "Frank watches Bunny from a branch." }
  - { id: evt_bbb_010, ts: 155, endTs: 560, type: character, characterId: c_rinky, text: "Rinky joins Frank in the tree." }
  - { id: evt_bbb_011, ts: 160, endTs: 560, type: character, characterId: c_gimera, text: "Gimera tags along with the other two bullies." }
  - { id: evt_bbb_012, ts: 170, type: scene, title: "The bullies strike", text: "Frank, Rinky and Gimera tease Bunny, throwing fruit and nuts at him from the trees." }
  - { id: evt_bbb_013, ts: 200, type: glossary, term: Flying squirrel, definition: "A squirrel with skin flaps between its legs that let it glide from tree to tree - which is how Frank swoops around." }
