# docker compose up --build   ->  http://localhost:4000
# Requires a .env file (copy .env.example) with at least JWT_SECRET and the SEED_* passwords.
services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/watch_spaces
      USE_MEMORY_DB: "false"
      CORS_ORIGIN: http://localhost:4000
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
